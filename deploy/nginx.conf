# 草本生长观察 — Nginx 站点配置
# 放到 /etc/nginx/conf.d/tcm-essays.conf，改 server_name 后 nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;

    # ↓↓↓ 改成你的域名
    server_name example.com www.example.com;

    root /var/www/tcm-essays;
    index index.html;

    charset utf-8;
    charset_types text/css application/javascript application/json text/plain text/markdown;

    # 日志（便于观察爬虫抓取情况，检查 Baiduspider / GPTBot 是否来访）
    access_log /var/log/nginx/tcm-essays.access.log;
    error_log  /var/log/nginx/tcm-essays.error.log warn;

    # gzip：文本资源压缩，HTML/CSS/JS/MD 体积可降 70% 以上
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/markdown application/javascript application/json application/xml image/svg+xml;

    # 安全响应头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 明文 Markdown 与 XML 必须给对 MIME，便于 AI 抓取方正确解析
    location ~* \.md$ {
        default_type text/markdown;
        add_header Cache-Control "public, max-age=3600";
    }
    location = /llms.txt {
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600";
    }
    location = /llms-full.txt {
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600";
    }
    location = /sitemap.xml {
        default_type application/xml;
        add_header Cache-Control "public, max-age=3600";
    }
    location = /robots.txt {
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600";
    }

    # 图片与 SDK 长缓存（带指纹或极少变更的资源）
    location /images/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location /js/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # HTML 不缓存，保证更新即时生效
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    # 路由兜底：404 回首页（避免旧链接失效）
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    # ===== HTTPS（certbot 会自动改写本节，也可手动启用）=====
    # listen 443 ssl http2;
    # listen [::]:443 ssl http2;
    # ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers HIGH:!aNULL:!MD5;
    # add_header Strict-Transport-Security "max-age=31536000" always;
}
